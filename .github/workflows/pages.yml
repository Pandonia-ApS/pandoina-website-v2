name: Deploy preview to GitHub Pages

# Publishes ONLY preview/index.html, preview/booking.html and their photographs.
#
# Deliberately NOT published: design/ (internal phase documents, including the
# internal-only territory names), docs/, src/, scripts/. A GitHub Pages site is
# reachable by anyone with the URL even when the repository is private, unless
# the organisation is on Enterprise Cloud with Pages access control. Keep the
# published surface to the preview itself.

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'public/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/images
          # Every image, whatever the extension. An earlier version globbed
          # *.jpg and silently dropped a .webp, which 404'd on the live site.
          cp public/images/* _site/images/
          # The preview loads images from ../public/images/ when opened from a
          # clone. Flatten that to images/ for the published root.
          # index.html is the site; booking.html is the booking preview
          # (demo availability, labelled DEMO / NOT LIVE on the page).
          for page in index booking; do
            sed 's|\.\./public/images/|images/|g' "preview/$page.html" > "_site/$page.html"
            if grep -q '\.\./public/images/' "_site/$page.html"; then
              echo "image paths were not rewritten in $page.html"; exit 1
            fi
          done
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll

          # Fail the build if a page references an image that is not here.
          missing=0
          for f in $(grep -ho 'src="images/[^"]*"' _site/index.html _site/booking.html \
                     | sed 's|src="||; s|"||' | sort -u); do
            if [ ! -f "_site/$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "referenced images are missing from the published site"
            exit 1
          fi

          echo "--- published files ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
