name: Deploy public site to GitHub Pages

# Publishes ONLY the public production site: site/ (Danish at /, English at
# /en/, 404 page, icons, social image) plus the photographs it uses, with
# robots.txt and sitemap.xml generated for the site address.
#
# Never published: preview/ (the internal review build and the booking demo
# with demo availability), design/, docs/, src/, scripts/.
#
# The site address comes from GitHub Pages itself (actions/configure-pages),
# so once a custom domain is set under Settings → Pages it is used
# automatically on the next run. site.config.json can override it.
# See DOMAIN_SETUP.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public/images/**'
      - 'scripts/assemble-site.mjs'
      - 'site.config.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble the public site
        run: node scripts/assemble-site.mjs --site-url "${{ steps.pages.outputs.base_url }}" --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
